name: Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Bouw gesigneerde APK
    runs-on: ubuntu-latest
    steps:
      - name: Code ophalen
        uses: actions/checkout@v4

      - name: Node.js instellen
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Java 21 instellen
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Dependencies installeren
        run: npm ci

      - name: Android-project synchroniseren
        run: npx cap sync android

      - name: Android SDK 36 installeren
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Signing key ontgrendelen
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/app
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/magisterpro-release.jks

      - name: Release APK bouwen
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: APK klaarzetten
        run: cp android/app/build/outputs/apk/release/app-release.apk magisterpro.apk

      - name: APK als artifact opslaan
        uses: actions/upload-artifact@v4
        with:
          name: magisterpro-apk
          path: magisterpro.apk
          retention-days: 90

      - name: Publiceren als GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-apk
          name: MagisterPro voor Android
          body: |
            Gesigneerde APK van MagisterPro. Download `magisterpro.apk` op je telefoon en sta sideloaden toe via **Instellingen → Beveiliging → Onbekende bronnen** (of tik op het bestand in je bestandsbeheerder).

            De app laadt de live webapp van `https://magisterpro.vercel.app`, dus je ziet altijd de nieuwste versie. Nieuwe releases overschrijven de vorige installatie gewoon (dezelfde signing key).
          files: magisterpro.apk
          generate_release_notes: false
