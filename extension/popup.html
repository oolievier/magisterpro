<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MagisterPro</title>
  <style>
    body { width: 260px; margin: 0; padding: 16px; background: #0a0a0f; color: #fff; font: 12px/1.5 Inter, system-ui, sans-serif; }
    .head { display: flex; align-items: center; gap: 9px; margin-bottom: 10px; }
    .logo { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 9px; background: linear-gradient(135deg,#4f46e5,#7c3aed); font-weight: 800; }
    strong { font-size: 13px; }
    p { margin: 8px 0; color: #a1a1aa; font-size: 11px; }
    button { width: 100%; margin-top: 7px; padding: 8px 10px; border: 1px solid rgba(255,255,255,.12); border-radius: 9px; background: rgba(255,255,255,.05); color: #fff; cursor: pointer; font-size: 11px; }
    button.primary { background: #4f46e5; border-color: #6366f1; }
  </style>
</head>
<body>
  <div class="head"><span class="logo">M</span><strong>MagisterPro</strong></div>
  <p id="status">Sessie controleren…</p>
  <button class="primary" id="open">Open MagisterPro</button>
  <button id="clear">Sessie wissen</button>
  <script src="popup.js"></script>
</body>
</html>
